name: Build Infinity X A17 - POCO F5 (marble)

concurrency:
  group: infinity-marble-build
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Build variant"
        type: choice
        options:
          - userdebug
          - user
          - eng
        default: userdebug
      with_gapps:
        description: "Sertakan GApps"
        type: boolean
        default: true
      clean_build:
        description: "Jalankan 'm installclean' sebelum build"
        type: boolean
        default: false
      sync_only:
        description: "Hanya repo init + sync (buat tes local manifest & ukur disk, tanpa build)"
        type: boolean
        default: false
      shallow_clone:
        description: "Shallow clone (--depth=1) buat hemat disk"
        type: boolean
        default: true
      maintainer_name:
        description: "INFINITY_MAINTAINER"
        type: string
        default: "Yudharn"

env:
  # Otomatis jadi mount point volume gabungan dari step "Maksimalkan disk runner" —
  # tidak perlu diganti.
  INFINITY_SRC_DIR: /srv/infinity-marble
  ROM_MANIFEST_URL: https://github.com/ProjectInfinity-X/manifest
  ROM_BRANCH: "17"
  LUNCH_RELEASE: cp2a

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (ambil local_manifests/marble.xml)
        uses: actions/checkout@v4

      # Gabungkan sisa partisi root + disk temp jadi satu volume, plus buang paket
      # bawaan (dotnet/android-sdk-duplikat/haskell/codeql/docker images) yang tidak
      # kepakai. Realistanya nambah dari ~14GB ke kira-kira 60-90GB, tergantung image.
      - name: Maksimalkan disk runner
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 100
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: ${{ env.INFINITY_SRC_DIR }}

      # Runner GitHub-hosted itu VM baru tiap run — repo/git-lfs belum tentu ada.
      - name: Install repo tool & dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y git-lfs
          mkdir -p "$HOME/bin"
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verifikasi toolchain di runner
        run: |
          set -euo pipefail
          missing=0
          for c in repo git git-lfs java python3 curl; do
            if ! command -v "$c" >/dev/null 2>&1; then
              echo "::error::'$c' tidak ditemukan di runner."
              missing=1
            fi
          done
          java -version
          [ "$missing" -eq 0 ]

      - name: Setup git & git-lfs
        run: |
          set -euo pipefail
          git config --global user.name "${{ inputs.maintainer_name }}"
          git config --global user.email "ci@yudharn.local"
          git config --global color.ui false
          git lfs install --skip-repo

      - name: Siapkan workspace
        run: mkdir -p "${{ env.INFINITY_SRC_DIR }}"

      - name: repo init (Infinity X branch ${{ env.ROM_BRANCH }})
        working-directory: ${{ env.INFINITY_SRC_DIR }}
        run: |
          set -euo pipefail
          DEPTH_FLAG=""
          if [ "${{ inputs.shallow_clone }}" = "true" ]; then
            DEPTH_FLAG="--depth=1"
          fi
          repo init --no-repo-verify --git-lfs \
            -u "${{ env.ROM_MANIFEST_URL }}" \
            -b "${{ env.ROM_BRANCH }}" \
            -g default,-mips,-darwin,-notdefault,qcom,waipio-vendor \
            $DEPTH_FLAG

      - name: Pasang local manifest marble
        working-directory: ${{ env.INFINITY_SRC_DIR }}
        run: |
          set -euo pipefail
          mkdir -p .repo/local_manifests
          cp "${{ github.workspace }}/local_manifests/marble.xml" .repo/local_manifests/marble.xml

      - name: repo sync
        working-directory: ${{ env.INFINITY_SRC_DIR }}
        run: |
          set -euo pipefail
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j"$(nproc --all)"

      - name: Cek sisa disk setelah sync
        working-directory: ${{ env.INFINITY_SRC_DIR }}
        run: |
          df -h "${{ env.INFINITY_SRC_DIR }}"
          du -sh . 2>/dev/null || true

      - name: Buat infinity_marble.mk (product file khusus Infinity-X)
        working-directory: ${{ env.INFINITY_SRC_DIR }}
        run: |
          set -euo pipefail
          DT=device/xiaomi/marble
          if [ ! -d "$DT" ]; then
            echo "::error::$DT tidak ada setelah sync — cek local_manifests/marble.xml"
            exit 1
          fi

          if ! grep -q "infinity_marble.mk" "$DT/AndroidProducts.mk"; then
            sed -i '/\$(LOCAL_DIR)\/lineage_marble\.mk/a\    $(LOCAL_DIR)/infinity_marble.mk' \
              "$DT/AndroidProducts.mk"
          fi

          cat > "$DT/infinity_marble.mk" << 'MKEOF'
          #
          # Copyright (C) 2026 Project Infinity X
          #
          # SPDX-License-Identifier: Apache-2.0
          #
          # Pengganti lineage_marble.mk: device.mk sama, tapi common config dari
          # vendor/infinity (bukan vendor/lineage, yang tidak ada di source Infinity-X).

          $(call inherit-product, device/xiaomi/marble/device.mk)
          $(call inherit-product, vendor/infinity/config/common_full_phone.mk)

          PRODUCT_NAME := infinity_marble
          PRODUCT_DEVICE := marble
          PRODUCT_MANUFACTURER := Xiaomi
          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO F5

          PRODUCT_GMS_CLIENTID_BASE := android-xiaomi

          # Fingerprint resmi POCO F5 (build MIUI/HyperOS acuan blob vendor) — disalin dari
          # lineage_marble.mk supaya Play Integrity & blob kamera tetap cocok.
          BUILD_FINGERPRINT := POCO/marble_global/marble:15/AQ3A.250226.002/OS3.0.4.0.VMRMIXM:user/release-keys
          MKEOF

      - name: Lunch & build (bacon)
        if: ${{ inputs.sync_only != true }}
        working-directory: ${{ env.INFINITY_SRC_DIR }}
        run: |
          set -euo pipefail
          source build/envsetup.sh

          export INFINITY_MAINTAINER="${{ inputs.maintainer_name }}"
          export WITH_GAPPS="${{ inputs.with_gapps }}"
          export TARGET_HAS_UDFPS=false

          # Coba syntax lunch <product>-<release>-<variant> (release-config, standar A14+).
          # Fallback ke syntax lama kalau entah kenapa release-config-nya beda.
          lunch "infinity_marble-${{ env.LUNCH_RELEASE }}-${{ inputs.build_variant }}" \
            || lunch "infinity_marble-${{ inputs.build_variant }}"

          if [ "${{ inputs.clean_build }}" = "true" ]; then
            m installclean
          fi

          m bacon -j"$(nproc --all)"

      - name: Cari hasil build
        if: ${{ inputs.sync_only != true }}
        working-directory: ${{ env.INFINITY_SRC_DIR }}
        run: |
          set -euo pipefail
          ZIP=$(ls out/target/product/marble/Project_Infinity-X-*.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then
            echo "::error::Zip hasil build tidak ketemu di out/target/product/marble/"
            exit 1
          fi
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$(basename "$ZIP")" >> "$GITHUB_ENV"

      # Sesuai pola CI kernel kamu yang sudah ada (private repo workflow -> public repo
      # release via gh CLI + PAT), tinggal tambah step `gh release create` di sini kalau
      # sudah tentukan repo publik tujuannya. Untuk sekarang upload sebagai artifact dulu.
      - name: Upload artifact
        if: ${{ inputs.sync_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.INFINITY_SRC_DIR }}/${{ env.ZIP_PATH }}
            ${{ env.INFINITY_SRC_DIR }}/${{ env.ZIP_PATH }}.sha256
          retention-days: 14
          
