name: Port HyperOS ROM to marble (POCO F5)

on:
  workflow_dispatch:
    inputs:
      donor_rom_url:
        description: 'URL ROM donor (paket fastboot .tgz/.zip berisi image mentah, ATAU paket recovery/OTA berisi payload.bin)'
        required: true
        type: string
      target_rom_url:
        description: 'URL stock ROM fastboot marble/POCO F5 (sumber vendor, odm, boot, firmware)'
        required: true
        type: string
      output_name:
        description: 'Nama dasar file output (tanpa ekstensi)'
        required: false
        type: string
        default: 'marble_HyperOS_Port'
      port_mode:
        description: 'system_only = paling aman (disarankan untuk donor beda chipset). system_vendor = ambil vendor dari donor juga (HANYA jika donor & marble satu platform chipset yang sama)'
        required: true
        type: choice
        options:
          - system_only
          - system_vendor
        default: system_only
      disable_avb:
        description: 'Nonaktifkan verifikasi AVB pada vbmeta (wajib untuk quick port lintas-ROM)'
        required: false
        type: boolean
        default: true
      patch_fstab:
        description: 'Patch fstab di vendor/odm: hapus forceencrypt/fileencryption + set mount system/vendor/product/odm jadi rw'
        required: false
        type: boolean
        default: true
      create_release:
        description: 'Upload hasil sebagai GitHub Release'
        required: false
        type: boolean
        default: true

env:
  WORKDIR: ${{ github.workspace }}/portwork

jobs:
  port:
    name: Port ROM
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # GITHUB_TOKEN default cuma read-only kalau tidak dideklarasikan di sini --
    # softprops/action-gh-release butuh contents:write untuk buat Release
    # (tanpa ini gagal 403 "Resource not accessible by integration").
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ROM Xiaomi fastboot bisa 6-8GB per paket (donor + target = bisa >15GB).
      # Runner GitHub hosted default cuma ~14GB free space kalau tidak dibersihkan dulu.
      - name: Free up disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils \
            e2fsprogs erofs-utils policycoreutils \
            brotli xz-utils zip unzip p7zip-full \
            aria2 curl git build-essential \
            python3 python3-pip
          df -h /

      # affggh/zenstorage lpunpack_and_lpmake TIDAK dipakai lagi -- build.sh mereka
      # ikut mengompilasi liblog upstream yang punya #include <windows.h> tak
      # terjaga (gagal fatal di Linux). nmeum/android-tools adalah build system
      # CMake yang sudah dipatch bersih untuk Linux, dipakai langsung oleh paket
      # android-tools Alpine/NixOS/openmamba.
      #
      # Dibangun HANYA target lpunpack/lpmake/lpdump (bukan `make` polos/semua
      # target) -- build penuh ikut mengompilasi adb/fastboot yang perlu simbol
      # libusb >=1.0.28 (LIBUSB_SPEED_SUPER_PLUS_X2 dkk, USB3.2 SuperSpeedPlus
      # x2) yang belum ada di libusb-1.0-0-dev Ubuntu 24.04 (baru versi 1.0.27)
      # -- gagal compile, dan adb/fastboot itu sendiri tidak dipakai di sini.
      # avbtool TIDAK punya CMake target (bukan sesuatu yang "dibuild") --
      # tarball ini men-vendor source AOSP external/avb asli di vendor/avb/,
      # jadi avbtool.py disalin langsung dari situ.
      - name: Build android-tools (lpunpack/lpmake/lpdump) + avbtool
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            cmake libusb-1.0-0-dev libpcre2-dev libgtest-dev \
            protobuf-compiler libprotobuf-dev libbrotli-dev \
            libzstd-dev liblz4-dev libfmt-dev
          AT_VER=36.0.1
          mkdir -p "$WORKDIR/tools" "$WORKDIR/bin"
          curl -Ls "https://github.com/nmeum/android-tools/releases/download/${AT_VER}/android-tools-${AT_VER}.tar.xz" \
            -o "$WORKDIR/android-tools.tar.xz"
          tar -xJf "$WORKDIR/android-tools.tar.xz" -C "$WORKDIR/tools"
          cd "$WORKDIR/tools/android-tools-${AT_VER}"
          cp vendor/avb/avbtool.py "$WORKDIR/bin/avbtool"
          mkdir -p build && cd build
          cmake ..
          make -j"$(nproc)" lpunpack lpmake lpdump
          find . -maxdepth 4 -type f -executable \
            \( -name 'lpunpack' -o -name 'lpmake' -o -name 'lpdump' \) \
            -exec cp {} "$WORKDIR/bin/" \;
          chmod +x "$WORKDIR/bin/"* 2>/dev/null || true
          ls -l "$WORKDIR/bin"

      - name: Fetch payload-dumper-go
        run: |
          set -euo pipefail
          PDG_VER=1.2.2
          curl -Ls "https://github.com/ssut/payload-dumper-go/releases/download/${PDG_VER}/payload-dumper-go_${PDG_VER}_linux_amd64.tar.gz" \
            -o "$WORKDIR/pdg.tar.gz"
          tar -xzf "$WORKDIR/pdg.tar.gz" -C "$WORKDIR/bin" payload-dumper-go
          chmod +x "$WORKDIR/bin/payload-dumper-go"

      - name: Prepare workspace
        run: |
          mkdir -p "$WORKDIR"/{donor,target,donor_img,target_img,out,merged}
          echo "$WORKDIR/bin" >> "$GITHUB_PATH"
          chmod +x scripts/*.sh

      - name: Download donor ROM
        env:
          DONOR_URL: ${{ inputs.donor_rom_url }}
        run: scripts/download_rom.sh "$DONOR_URL" "$WORKDIR/donor"

      - name: Download target (marble) ROM
        env:
          TARGET_URL: ${{ inputs.target_rom_url }}
        run: scripts/download_rom.sh "$TARGET_URL" "$WORKDIR/target"

      - name: Extract donor images
        run: scripts/extract_rom.sh "$WORKDIR/donor" "$WORKDIR/donor_img" "$WORKDIR/bin"

      - name: Extract target images
        run: scripts/extract_rom.sh "$WORKDIR/target" "$WORKDIR/target_img" "$WORKDIR/bin"

      - name: Run port (merge donor + target)
        env:
          PORT_MODE: ${{ inputs.port_mode }}
          DISABLE_AVB: ${{ inputs.disable_avb }}
        run: scripts/port_rom.sh "$WORKDIR/donor_img" "$WORKDIR/target_img" "$WORKDIR/merged" "$WORKDIR/bin" "$PORT_MODE" "$DISABLE_AVB"

      - name: Patch fstab (disable forceencrypt + rw)
        env:
          PATCH_FSTAB: ${{ inputs.patch_fstab }}
        run: scripts/patch_fstab.sh "$WORKDIR/merged" "$WORKDIR/bin" "$PATCH_FSTAB"

      - name: Package flashable bundle
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: scripts/package_rom.sh "$WORKDIR/merged" "$WORKDIR/target_img" "$WORKDIR/out" "$OUTPUT_NAME" "$WORKDIR/bin"

      - name: Upload manifest/debug info on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: port-debug-${{ github.run_id }}
          path: |
            ${{ env.WORKDIR }}/merged/PORT_MANIFEST.txt
            ${{ env.WORKDIR }}/out/target_super_dump.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.output_name }}
          path: ${{ env.WORKDIR }}/out/artifact/*
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: port-${{ inputs.output_name }}-${{ github.run_number }}
          name: ${{ inputs.output_name }} (build ${{ github.run_number }})
          files: ${{ env.WORKDIR }}/out/release/*
          body: |
            Quick-port otomatis.
            - Mode: ${{ inputs.port_mode }}
            - AVB verification disabled: ${{ inputs.disable_avb }}
            - fstab dipatch (forceencrypt off + rw): ${{ inputs.patch_fstab }}
            - Donor: ${{ inputs.donor_rom_url }}
            - Target base: marble (POCO F5)

            📦 Kalau asset di release ini ada beberapa `*.zip.part-NN`, GitHub
            membatasi 2GB per file jadi paketnya dipecah otomatis. Unduh SEMUA
            bagian lalu gabung sebelum di-push ke device (bisa langsung di
            Termux di HP, tidak perlu PC):
            `cat *.zip.part-* > ${{ inputs.output_name }}.zip`
            Lalu cocokkan checksum-nya dengan file `.sha256` yang ikut di-upload:
            `sha256sum -c ${{ inputs.output_name }}.zip.sha256`

            ⚠️ Belum diuji flashing fisik. Baca README repo ini sebelum flash ke device utama.
            
